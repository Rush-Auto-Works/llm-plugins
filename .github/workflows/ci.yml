name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        server: [maintenance, laps]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servers/${{ matrix.server }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:skill
        if: matrix.server == 'laps'
      - run: git diff --exit-code -- ../../plugin
        if: matrix.server == 'laps'

  converter:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python3 -W error -m unittest discover -s tests

  packages:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test chatgpt/package.test.mjs listing/listing.test.mjs listing/versions.test.mjs
